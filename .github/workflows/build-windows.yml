name: Windows-EXE bauen

# Läuft automatisch, sobald auf GitHub ein Release veröffentlicht wird,
# und kann zusätzlich im Reiter "Actions" manuell gestartet werden.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: PyInstaller installieren
        run: pip install pyinstaller

      - name: EXE bauen
        run: pyinstaller --onefile --noconsole --name sibank2educa sibank2educa.py

      - name: EXE als Download im Actions-Lauf bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: sibank2educa-windows
          path: dist/sibank2educa.exe

      - name: EXE an das Release anhängen
        if: github.event_name == 'release'
        run: gh release upload "${{ github.event.release.tag_name }}" dist/sibank2educa.exe --clobber
        env:
          GH_TOKEN: ${{ github.token }}
