name: Windows-EXE bauen

# Läuft automatisch, sobald auf GitHub ein Release veröffentlicht wird,
# und kann zusätzlich im Reiter "Actions" manuell gestartet werden.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Versionsnummer mit dem Release abgleichen
        if: github.event_name == 'release'
        shell: bash
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          tag="$TAG"
          version=$(python -c "import ast; print(next(n.value.value for n in ast.parse(open('sibank2educa.py', encoding='utf-8').read()).body if isinstance(n, ast.Assign) and getattr(n.targets[0], 'id', '') == '__version__'))")
          if [ "${tag#v}" != "$version" ]; then
            echo "::error::Release-Tag $tag passt nicht zu __version__ = $version in sibank2educa.py"
            exit 1
          fi

      - name: PyInstaller installieren
        run: pip install pyinstaller

      - name: EXE bauen
        run: pyinstaller --onefile --noconsole --name sibank2educa sibank2educa.py

      - name: EXE als Download im Actions-Lauf bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: sibank2educa-windows
          path: dist/sibank2educa.exe

      - name: EXE an das Release anhängen
        if: github.event_name == 'release'
        run: gh release upload "${{ github.event.release.tag_name }}" dist/sibank2educa.exe --clobber
        env:
          GH_TOKEN: ${{ github.token }}
